<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="OmniCore animated logo">
  <style>
    .oc-r1, .oc-r2, .oc-b { transform-origin: 50px 50px; }
    @keyframes oc-ripple { 0% { transform: scale(.5); opacity: .55; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes oc-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .oc-r1 { animation: oc-ripple 3.2s ease-out infinite; }
    .oc-r2 { animation: oc-ripple 3.2s ease-out infinite 1.6s; }
    .oc-b { animation: oc-breathe 4s ease-in-out infinite; }
  </style>
  <circle class="oc-r1" cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.55"></circle>
  <circle class="oc-r2" cx="50" cy="50" r="43" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"></circle>
  <circle class="oc-b" cx="50" cy="50" r="30" fill="none" stroke="#FFFFFF" stroke-width="9"></circle>
</svg>
